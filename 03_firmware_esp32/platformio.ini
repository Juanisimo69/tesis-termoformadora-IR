; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; PlatformIO busca libs en /lib automáticamente
; cuando están en subcarpetas con su propio .h/.cpp
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/MAX6675 library@^1.1.2
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    adafruit/Adafruit MLX90614 Library

monitor_speed = 115200

platform_packages = 
	tool-esptoolpy@https://github.com/Jason2866/esptool/releases/download/v4.8.7/esptool.zip
    
board_build.filesystem = spiffs
